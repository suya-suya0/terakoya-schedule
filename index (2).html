*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c','Yu Gothic',sans-serif;font-variant-numeric:normal}button{font:inherit;cursor:pointer}.wrap{max-width:1536px;margin:auto;padding:7px 7px 28px}.hero{height:190px;border-radius:29px 29px 16px 16px;background-color:#ee9693;background-image:linear-gradient(0deg,transparent 48%,#f6adaa77 48% 52%,transparent 52%),linear-gradient(90deg,transparent 48%,#f6adaa77 48% 52%,transparent 52%),repeating-linear-gradient(0deg,#ed9996 0 41px,#f2aaa7 41px 82px);background-size:88px 88px,88px 88px,auto;display:flex;align-items:flex-start;justify-content:center;gap:5px;padding:14px 3.2% 0;overflow:visible;position:relative;z-index:3}.hero .mascot{position:absolute;bottom:-18px;width:min(15vw,160px);min-width:102px;height:auto;object-fit:contain;z-index:4;filter:drop-shadow(0 3px 4px rgba(128,76,66,.13))}.hero .mascot.left{left:18px}.hero .mascot.right{right:18px}.hero .masthead{flex:0 1 auto;width:min(72vw,760px);text-align:center;background:#fff9f0;border-radius:100px;box-shadow:0 6px 14px #ad746328;padding:15px 2.4%}.title{font-family:'Yusei Magic','Zen Maru Gothic','M PLUS Rounded 1c',sans-serif;font-size:clamp(28px,5.3vw,74px);font-weight:400;letter-spacing:.01em;white-space:nowrap;line-height:1.12;display:inline-flex;align-items:center;justify-content:center;gap:.18em;color:#8d382d}.titleText{display:inline-block}.title .fl{font-size:.5em;color:#ef8f92;line-height:1;display:inline-flex;align-items:center;justify-content:center;transform:translateY(.02em)}.shell{background:#fffdfa;border:1px solid #f7e5dc;border-radius:32px;box-shadow:0 3px 18px #ab786515;padding:22px 23px;margin-top:-6px;position:relative;z-index:2}.filters{display:flex;align-items:center;flex-wrap:wrap;gap:11px}.tab{border:0;border-radius:100px;color:#fff;font-weight:800;font-size:clamp(13px,1.8vw,26px);padding:16px 25px;white-space:nowrap}.tab.g1,.pill.g1{background:var(--g1)}.tab.g2,.pill.g2{background:var(--g2)}.tab.g3,.pill.g3{background:var(--g3)}.tab.one,.pill.one{background:var(--one)}.tab.test,.pill.test{background:var(--test)}.tab.other,.pill.other{background:var(--other)}.tab[data-active="false"]{opacity:.53;filter:saturate(.7)}.tab:focus-visible,.nav:focus-visible{outline:3px solid #b95747;outline-offset:3px}.weekbtn{margin-left:auto;border:2px solid #e4c9bc;border-radius:99px;color:#843c2e;background:#fffaf6;padding:13px 18px;font-weight:800;font-size:clamp(13px,1.45vw,21px);white-space:nowrap}.dateRow{position:relative;display:grid;grid-template-columns:96px 1fr 96px 125px;align-items:center;gap:17px;max-width:930px;margin:22px auto 0}.year{display:none}.dateText{text-align:center;font-size:clamp(24px,3.2vw,47px);font-weight:800;white-space:nowrap}.nav{border:0;border-radius:999px;background:#f9e8e1;color:#873a2e;font-size:36px;height:58px;width:96px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0 0 3px}.nav.today{font-size:22px;font-weight:800;background:#fce3de;height:58px;width:125px;padding:0}.openingNotice{display:none;width:min(72%,860px);min-height:56px;margin:20px auto 8px;padding:16px 26px;background:#fff2e5;border:1px solid #f1dcc8;border-radius:18px;color:#8e4838;font-family:'Zen Maru Gothic','M PLUS Rounded 1c',sans-serif;font-size:clamp(18px,2vw,30px);font-weight:800;text-align:center;line-height:1.35;box-shadow:0 3px 10px rgba(173,120,101,.08);display:none;align-items:center;justify-content:center}.openingNotice.visible{display:flex}.list{display:grid;gap:14px;margin-top:18px}.event.one .subject:empty{display:none}.event{border-radius:19px;min-height:79px;display:grid;grid-template-columns: minmax(165px,18%) 138px 1fr;overflow:hidden;align-items:stretch;background:#fff5e9;border-left:12px solid var(--g1)}.event.g2{background:#fff0eb;border-color:var(--g2)}.event.g3{background:#f1f8f0;border-color:var(--g3)}.event.one{background:#edf7ff;border-color:var(--one)}.event.test{background:#f4f9ed;border-color:var(--test)}.event.other{background:#f4f4fc;border-color:var(--other)}.time{display:flex;align-items:center;padding:14px 16px;font-size:clamp(15px,1.9vw,26px);font-weight:800;white-space:nowrap}.pill{margin:auto 0;border-radius:99px;padding:11px 8px;color:#fff;text-align:center;font-size:clamp(16px,1.8vw,26px);font-weight:800}.subject{align-self:center;padding:11px 24px;font-size:clamp(20px,2.2vw,32px);font-weight:800}.empty{display:none;border:2px dashed #f6e0d5;border-radius:27px;min-height:240px;margin-top:16px;padding:27px 12px;text-align:center}.empty.visible{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:10px}.empty p{font-size:clamp(18px,2.2vw,30px);margin:0;color:#8c4d42}.empty img{height:auto;width:min(395px,84vw);object-fit:contain}.foot{text-align:center;margin:20px 4px 0;font-size:clamp(10px,1.15vw,15px);color:#c6aba4;font-weight:400}.foot .flower{color:#ef9e92;margin-right:7px}.weekly{display:none;margin-top:15px;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;align-items:stretch}.weekly.show{display:grid}.day{border:1px solid #efd9d0;border-radius:18px;background:#fffaf7;min-height:96px;padding:10px 8px;text-align:left;color:var(--ink);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px}.day.selected{outline:2px solid #d97869}.dayhead{display:block;flex:0 0 auto;font-family:'Yusei Magic','Zen Maru Gothic','M PLUS Rounded 1c',sans-serif;font-size:clamp(18px,1.8vw,32px);line-height:1.15;color:#943a2f;padding:2px 4px 0}.daylist{display:flex;flex-direction:column;align-items:stretch;gap:5px;flex:1 1 auto}.minitag{display:block;border-radius:8px;padding:4px 8px;font-size:13px;font-family:'Zen Maru Gothic','M PLUS Rounded 1c',sans-serif;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}.minitag.g1{background:var(--g1)}.minitag.g2{background:var(--g2)}.minitag.g3{background:var(--g3)}.minitag.one{background:var(--one)}.minitag.test{background:var(--test)}.m /* お知らせとカテゴリーボタンの間隔 */
.noticeBoard.bottom.visible + .filters{margin-top:32px}

.noticeBoard.bottom{background:#fff8e9;border:1px solid #e4cc98;color:#865308}
.noticeHeading{font-weight:800;font-size:clamp(15px,1.6vw,22px);white-space:pre-wrap;overflow-wrap:anywhere}
.noticeBody{font-size:clamp(13px,1.25vw,17px);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.noticeLink{display:inline-flex;align-items:center;margin-top:8px;color:#a94d56;text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:14px}
.noticeBoard.bottom .noticeLink{color:#966014}
@media(max-width:800px){.noticeBoard{padding:12px 14px;margin-top:13px;border-radius:15px}.noticeHeading{font-size:15px}.noticeBody{font-size:13px}}

/* 申込みリンクを強調し、右側に配置 */
.noticeBoard.bottom .noticeLink{
 display:flex;width:max-content;max-width:100%;margin:16px 0 0 auto;
 padding:12px 20px;justify-content:center;align-items:center;
 border-radius:999px;background:#d95b6f;color:white;text-decoration:none;
 font-family:'M PLUS Rounded 1c',sans-serif;font-size:clamp(16px,1.6vw,20px);
 font-weight:800;box-shadow:0 3px 9px rgba(174,78,97,.16);line-height:1.5;
}
.noticeBoard.bottom .noticeLink:hover{background:#c44c60}
.noticeBoard.bottom .noticeLink:focus-visible{outline:3px solid #983646;outline-offset:3px}
@media(max-width:600px){.noticeBoard.bottom .noticeLink{padding:12px 17px;font-size:16px}}

/* 予定表示：時間とラベルの余白・質問受付/マンツーマンを1行化・勉強会と検定を色分け */
.event{column-gap:14px;grid-template-columns:minmax(165px,18%) minmax(140px,175px) minmax(0,1fr)}
.event .time{padding-right:10px}
.event .pill{line-height:1.2;white-space:nowrap;padding:11px 14px}
.event.one,.event.other,.event.test{grid-template-columns:minmax(165px,18%) minmax(155px,200px) minmax(0,1fr)}
.event.one .subject,.event.other .subject,.event.test .subject{display:none}
.event.test.study{background:#eef8ef;border-color:#419a70}
.event.test.exam{background:#fff3e6;border-color:#d98b4a}
.pill.test.study,.minitag.test.study{background:#419a70}
.pill.test.exam,.minitag.test.exam{background:#d98b4a}
@media(max-width:800px){
 .event{grid-template-columns:minmax(100px,35%) minmax(68px,18%) minmax(0,1fr);column-gap:9px}
 .event.one,.event.other,.event.test{grid-template-columns:minmax(100px,35%) minmax(135px,1fr)}
 .event .time{padding:8px 2px 8px 8px}
 .event .pill{font-size:clamp(12px,3.4vw,18px);padding:9px 11px}
}
@media(max-width:380px){
 .event{grid-template-columns:minmax(90px,35%) minmax(61px,18%) minmax(0,1fr);column-gap:7px}
 .event.one,.event.other,.event.test{grid-template-columns:minmax(90px,35%) minmax(128px,1fr)}
 .event .pill{font-size:12px;padding:9px 8px}
}

/* 個別ラベルは文字の長さに合わせ、予定カードの横幅いっぱいには伸ばさない */
.event{grid-template-columns:minmax(165px,18%) max-content minmax(0,1fr);column-gap:16px}
.event .pill{justify-self:start;width:max-content;max-width:100%;min-width:0!important;white-space:nowrap;padding:11px 24px;line-height:1.3}
.event .time{padding-right:12px}
.tab.study{background:#419a70}.tab.exam{background:#d98b4a}
@media(max-width:800px){
 .event,.event.one,.event.other,.event.test{grid-template-columns:minmax(106px,35%) max-content minmax(0,1fr);column-gap:10px}
 .event .pill{width:max-content;min-width:0!important;padding:9px 15px;font-size:clamp(12px,3.4vw,18px)}
 .event .time{padding:8px 4px 8px 9px}
}
@media(max-width:380px){
 .event,.event.one,.event.other,.event.test{grid-template-columns:minmax(94px,34%) max-content minmax(0,1fr);column-gap:7px}
 .event .pill{min-width:0!important;padding:8px 11px;font-size:12px}
}

/* 週間表示：日付と曜日を同じ行に固定 */
.dayhead{white-space:nowrap;word-break:keep-all;overflow:visible;letter-spacing:-.03em;font-size:clamp(12px,1.45vw,25px)}
@media(max-width:800px){.dayhead{font-size:clamp(10px,2.4vw,15px);padding:1px 0 0;letter-spacing:-.05em}}
@media(max-width:380px){.dayhead{font-size:10px;letter-spacing:-.07em}}
.day.unpublished{opacity:.45;cursor:not-allowed}

/* 開室時間を大きく、振替を独立した色で表示 */
.openingNotice{width:min(82%,960px);min-height:72px;padding:18px 26px;font-size:clamp(22px,2.9vw,38px);line-height:1.4}
.event.makeup{background:#fff0f5;border-color:#c883a6}
.pill.makeup,.tab.makeup,.minitag.makeup{background:#c883a6}
@media(max-width:800px){.openingNotice{width:96%;min-height:65px;padding:15px 12px;font-size:clamp(20px,5.1vw,27px)}}
.event.makeup .subject{overflow-wrap:anywhere;font-size:clamp(16px,1.9vw,27px)}\n
.heroMessage{position:absolute;left:19%;right:19%;bottom:15px;z-index:5;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3;font-family:'M PLUS Rounded 1c',sans-serif;pointer-events:none;text-shadow:0 1px 1px rgba(255,255,255,.5)}
.heroMessage[hidden]{display:none!important}
@media(max-width:800px){.heroMessage{left:16%;right:16%;bottom:10px;line-height:1.18}}

/* 開室時間：文字列を1行固定。細いスマホでも時刻と見出しを分断しない。 */
.openingNotice,.openingNotice.visible{
  white-space:nowrap; flex-wrap:nowrap; width:min(96%,960px);
  max-width:100%; min-width:0; box-sizing:border-box;
  font-size:clamp(16px,3.1vw,36px); letter-spacing:-.025em;
  line-height:1.25; padding:14px 10px;
}

  .openingNotice,.openingNotice.visible{width:100%;font-size:clamp(15px,4.3vw,25px);padding:13px 5px;min-height:59px;}
}
@media (max-width:360px){.openingNotice,.openingNotice.visible{font-size:15px;letter-spacing:-.05em;}}

'use strict';
const labels={g1:'中1',g2:'中2',g3:'中3',one:'マンツーマン',study:'勉強会',exam:'検定',makeup:'振替',other:'質問受付'};
// 既存のGASデータ形式を保ったまま、表示だけ区別する
function eventType(e){if(e.category!=='test')return '';return e.title==='勉強会'?'study':'exam';}
function pillText(e){return e.category==='test'?e.title:(labels[e.category]||'');}
const weekdays=['日','月','火','水','木','金','土'];
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
// 毎月25日から翌月末まで公開。それまでは当月末まで。
// JSTで日付判定（閲覧端末が海外設定でも同じ公開日になる）。
function jstToday(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());const get=t=>Number(parts.find(p=>p.type===t).value);return new Date(get('year'),get('month')-1,get('day'));}
function lastPublicDay(){const now=jstToday();return new Date(now.getFullYear(),now.getMonth()+(now.getDate()>=25?2:1),0);}
const after=(a,b)=>midnight(a).getTime()>midnight(b).getTime();
const before=(a,b)=>midnight(a).getTime()<midnight(b).getTime();
const capPublic=(d)=>before(d,jstToday())?jstToday():(after(d,lastPublicDay())?lastPublicDay():midnight(d));
const el=id=>document.getElementById(id);
let selected=jstToday(),selectedFilters=new Set(),weekMode=false,events=[],openings=[],allDayEvents=[],loadedMonth='',loading=false;
let notices=null;
function matches(d){if(before(d,jstToday())||after(d,lastPublicDay()))return [];return events.filter(e=>e.date===key(d)&&(selectedFilters.size===0||selectedFilters.has(e.category)||(e.category==='test'&&selectedFilters.has(eventType(e)))));}
function render(){
 selected=capPublic(selected);
 const prev=el('prev');if(prev)prev.disabled=!after(selected,jstToday());
 const overlaySub=el('loadingSub');
 if(overlaySub){overlaySub.textContent=loading?'予定を準備しています。少々お待ちください。':'予定を表示します'}
 el('date').textContent=`${selected.getMonth()+1}月${selected.getDate()}日（${weekdays[selected.getDay()]}）`;
 const open=el('openingNotice');
 const dateKey=key(selected);
 const todayEvents=events.filter(e=>e.date===dateKey&&!before(selected,jstToday())); // カテゴリで絞り込んでいても、その日の全公開予定を使う
 let opening=openings.find(o=>o.date===dateKey&&o.manual===true)||null;
 if(!opening&&todayEvents.length){
   const times=todayEvents.filter(e=>/^\d{2}:\d{2}$/.test(e.start)&&/^\d{2}:\d{2}$/.test(e.end));
   if(times.length){
     const earliest=times.reduce((a,e)=>e.start<a?e.start:a,times[0].start);
     const latest=times.reduce((a,e)=>e.end>a?e.end:a,times[0].end);
     const [hh,mm]=latest.split(':').map(Number);
     const rounded=Math.ceil((hh*60+mm)/30)*30;
     const end=String(Math.floor(rounded/60)).padStart(2,'0')+':'+String(rounded%60).padStart(2,'0');
     opening={start:earliest,end};
   }
 }
 if(!opening)opening=openings.find(o=>o.date===dateKey)||null;
 if(opening){
   open.textContent='開室時間 '+opening.start+'〜'+opening.end;
 }else if(!loading && todayEvents.length===0){
   open.textContent='おやすみ';
 }else{
   open.textContent='';
 }
 open.classList.toggle('visible',Boolean(open.textContent));
 const allDayBox=el('allDayList');allDayBox.replaceChildren();
 if(!loading && !before(selected,jstToday()) && !after(selected,lastPublicDay())){
  const showing=allDayEvents.filter(a=>a.startDate<=dateKey && dateKey<a.endDate);
  for(const a of showing){
   const item=document.createElement('div');item.className='allDayItem allDaySimpleCard';
   const heading=document.createElement('div');heading.className='allDayTitle';
   heading.textContent='🌷 '+a.title;item.append(heading);
   if(key(add(selected,1))<a.endDate){
    const arrow=document.createElement('span');arrow.className='allDayArrow';
    arrow.textContent='⇒';arrow.setAttribute('role','img');arrow.setAttribute('aria-label','明日も続きます');
    item.append(arrow);
   }
   allDayBox.append(item);
  }
 }
 const box=el('list');box.replaceChildren();const today=matches(selected);
 el('empty').classList.toggle('visible',!loading&&today.length===0);
 for(const e of today){
  const extra=eventType(e);const div=document.createElement('div');div.className='event '+e.category+(extra?' '+extra:'');
  const time=document.createElement('span');time.className='time';time.textContent=e.start+'〜'+e.end;
  const pill=document.createElement('span');pill.className='pill '+e.category+(extra?' '+extra:'');pill.textContent=pillText(e);
  const subject=document.createElement('span');subject.className='subject';subject.textContent=e.category==='makeup'?(e.detail||''):(['one','other','test'].includes(e.category)?'':e.title);
  div.append(time,pill,subject);box.append(div);
 }
 const week=el('week');week.replaceChildren();week.classList.toggle('show',weekMode);
 if(weekMode){const first=add(selected,-selected.getDay());for(let i=0;i<7;i++){
  const d=add(first,i);const unpublished=before(d,jstToday())||after(d,lastPublicDay());const cell=document.createElement('button');cell.className='day'+(key(d)===key(selected)?' selected':'')+(unpublished?' unpublished':'');cell.disabled=unpublished;
  const head=document.createElement('div');head.className='dayhead';head.textContent=`${d.getDate()}（${weekdays[i]}）`;
  const listWrap=document.createElement('div');listWrap.className='daylist';
  for(const e of (unpublished?[]:matches(d))){
   const extra=eventType(e);const tag=document.createElement('span');tag.className='minitag '+e.category+(extra?' '+extra:'');tag.textContent=e.category==='makeup'?('振替'+(e.detail?'：'+e.detail:'')):(['one','other','test'].includes(e.category)?pillText(e):(labels[e.category]||'')+' '+e.title);listWrap.append(tag)
  }
  cell.append(head,listWrap);
  cell.onclick=()=>setDate(d);week.append(cell);
 }}
 drawFilters();
}
function drawFilters(){
 const box=el('filters');box.replaceChildren();
 const reset=document.createElement('button');
 reset.className='tab all';reset.textContent='すべて';reset.type='button';
 reset.dataset.active=String(selectedFilters.size===0);
 reset.setAttribute('aria-pressed',String(selectedFilters.size===0));
 reset.onclick=()=>{selectedFilters.clear();render()};
 box.append(reset);
 for(const [cat,name] of Object.entries(labels)){
  if(cat==='study')continue;
  const active=selectedFilters.has(cat);
  const b=document.createElement('button');b.type='button';b.className='tab '+cat;b.textContent=name;
  // 全件表示中はすべての色を保つ。選択中は選択した項目を強調する。
  b.dataset.active=String(selectedFilters.size===0||active);
  b.dataset.selected=String(active);
  b.setAttribute('aria-pressed',String(active));
  b.onclick=()=>{
   if(selectedFilters.has(cat)){selectedFilters.delete(cat)}else{selectedFilters.add(cat)}
   render();
  };
  box.append(b);
 }
 const w=document.createElement('button');w.type='button';w.className='weekbtn';
 w.textContent=weekMode?'▣ 1日表示':'▦ 週間表示';
 w.onclick=()=>{weekMode=!weekMode;render()};box.append(w);
}

function renderHeroMessage(){
 const node=el('heroMessage');if(!node)return;
 const msg=String(notices&&notices.heroMessage||'').slice(0,160).trim();
 const validFonts={'rounded':"'M PLUS Rounded 1c',sans-serif",'magic':"'Yusei Magic',sans-serif",'zen':"'Zen Maru Gothic',sans-serif"};
 const font=String(notices&&notices.heroFont||'rounded');
 const size=Math.min(40,Math.max(12,Number(notices&&notices.heroSize)||22));
 const color=String(notices&&notices.heroColor||'#81372d');
 node.textContent=msg;node.hidden=!msg;
 node.style.fontFamily=validFonts[font]||validFonts.rounded;
 node.style.fontSize='clamp(12px, '+(size*.75)+'px + 0.35vw, '+size+'px)';
 node.style.color=/^#[0-9a-fA-F]{6}$/.test(color)?color:'#81372d';
}
function renderNotices(){
  renderHeroMessage();
  if(!notices)return;
  [['top','noticeTop'],['bottom','noticeBottom']].forEach(([prefix,id])=>{
    const title=String(notices[prefix+'Title']||'');
    const body=String(notices[prefix+'Body']||'');
    const linkText=String(notices[prefix+'LinkText']||'');
    const rawUrl=String(notices[prefix+'LinkUrl']||'').trim();
    const validUrl=/^https?:\/\/[^\s]+$/i.test(rawUrl)?rawUrl:'';
    const link=el(id+'Link');
    link.textContent=validUrl?linkText:'';
    if(validUrl&&linkText.trim()){link.href=validUrl;link.style.display='inline-flex'}
    else {link.removeAttribute('href');link.style.display='none'}
    el(id+'Title').textContent=title;
    el(id+'Body').textContent=body;
    el(id).classList.toggle('visible',Boolean(title.trim()||body.trim()||(validUrl&&linkText.trim())));
  });
}
function setStatus(message){el('syncState').textContent=message}
// ウォンバットは必ず左端から右端へ完走。取得が速ければ残りを加速。
let wombatAnimation=null, wombatFinished=false, dataFinished=false;
function startWombatWalk(){
 const overlay=el('loadingOverlay');
 const wombat=overlay.querySelector('.loading-wombat');
 const track=overlay.querySelector('.loading-track');
 if(wombatAnimation){wombatAnimation.cancel();wombatAnimation=null;}
 wombatFinished=false;dataFinished=false;
 overlay.classList.add('show');
 wombat.style.transform='translateX(0px)';
 const distance=track.clientWidth + 110; // 画像左端の待機位置から右端の外側まで
 wombatAnimation=wombat.animate([
   {transform:'translateX(0px)'},
   {transform:`translateX(${distance}px)`}
 ],{duration:3400,easing:'linear',fill:'forwards'});
 wombatAnimation.onfinish=()=>{wombatFinished=true;finishWombatLoading();};
}
function finishWombatLoading(){
 if(!dataFinished||!wombatFinished)return;
 el('loadingOverlay').classList.remove('show');
 if(wombatAnimation){wombatAnimation.cancel();wombatAnimation=null;}
}
function markDataFinished(){
 dataFinished=true;
 if(wombatAnimation&&!wombatFinished){
   // 取得完了後は残りの道のりを最長450msで歩く（必要なら爆速！）
   const remaining=Math.max(0,3400-wombatAnimation.currentTime);
   wombatAnimation.playbackRate=Math.max(1,remaining/450);
 }
 finishWombatLoading();
}

// GitHub Pages から GAS の読み取り専用APIを呼び出す。
let publicRequestSerial=0;
function fetchTerakoyaSchedule(start,end,onSuccess,onFailure){
 const callback='__terakoyaCallback_'+(++publicRequestSerial);
 const script=document.createElement('script');
 let finished=false;
 let timeout=null;
 function cleanup(){
   if(finished)return false;
   finished=true;
   clearTimeout(timeout);
   delete window[callback];
   script.remove();
   return true;
 }
 window[callback]=result=>{if(!cleanup())return;if(result&&result.status!=='error')onSuccess(result);else onFailure(new Error('公開APIでエラーが発生しました'));};
 script.onerror=()=>{if(cleanup())onFailure(new Error('GAS接続エラー'));};
 timeout=setTimeout(()=>{if(cleanup())onFailure(new Error('通信タイムアウト'));},25000);
 const url=String(window.TERAKOYA_GAS_URL).trim()+'?api=schedule&callback='+encodeURIComponent(callback)+'&start='+encodeURIComponent(start)+'&end='+encodeURIComponent(end);
 script.src=url;script.async=true;
 document.head.appendChild(script);
}
function load(){
 const first=new Date(selected.getFullYear(),selected.getMonth(),1);
 // 週間表示で月境界を跨ぐ場合も前後の予定を取得する。
 const start=jstToday(),normalEnd=new Date(selected.getFullYear(),selected.getMonth()+2,11);
 const publicEnd=add(lastPublicDay(),1); // GASの終了日は指定日を含まない
 const end=normalEnd<publicEnd?normalEnd:publicEnd;
 const range=key(start)+'|'+key(end);
 if(loadedMonth===range)return;
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec$/.test(String(window.TERAKOYA_GAS_URL||'').trim())){
  loading=false;events=[];openings=[];allDayEvents=[];setStatus('初期設定が必要です：config.js にGASの /exec URLを設定してください。');render();return;
 }
 loading=true;startWombatWalk();setStatus('予定を読み込み中…');render();
 pendingRange=range;
 fetchTerakoyaSchedule(key(start),key(end),result=>{
  if(range!==pendingRange)return;
  loading=false;notices=result.notices||null;renderNotices();
  allDayEvents=(result.allDayEvents||[]).filter(a=>typeof a.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(a.startDate)&&/^\d{4}-\d{2}-\d{2}$/.test(a.endDate)&&a.startDate<a.endDate&&a.endDate>key(jstToday())&&a.startDate<=key(lastPublicDay()));
  openings=(result.openings||[]).filter(o=>/^\d{4}-\d{2}-\d{2}$/.test(o.date)&&/^\d{2}:\d{2}$/.test(o.start)&&/^\d{2}:\d{2}$/.test(o.end)&&o.date>=key(jstToday())&&o.date<=key(lastPublicDay()));events=(result.events||[]).filter(e=>['g1','g2','g3','one','test','makeup','other'].includes(e.category)&&e.date>=key(jstToday())&&e.date<=key(lastPublicDay()))
   .sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)||a.end.localeCompare(b.end)||(a.category||'').localeCompare(b.category||''));
  if(result.status==='ok'){loadedMonth=range;setStatus('Googleカレンダーと同期済み（ページ更新で最新情報を取得）')}
  else setStatus('現在、公開前の確認中です。');
  render();markDataFinished();
 },err=>{
  if(range!==pendingRange)return;
  loading=false;events=[];openings=[];allDayEvents=[];setStatus('予定の取得に失敗しました。通信環境やGASの公開設定をご確認ください。');render();markDataFinished();
 });
}
let pendingRange='';
function setDate(d){selected=capPublic(d);render();load()}
el('prev').onclick=()=>setDate(add(selected,weekMode?-7:-1));
el('next').onclick=()=>setDate(add(selected,weekMode?7:1));
el('today').onclick=()=>setDate(new Date());
render();load();
</script></body></html>
